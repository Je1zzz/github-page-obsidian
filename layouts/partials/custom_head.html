<style>
  :root { --font-main: Verdana, "PingFang SC", "Microsoft YaHei", sans-serif; --font-secondary: var(--font-main); }
  :root[data-theme="light"] { --background-color: #fff; --heading-color: #222; --text-color: #444; --link-color: #3273dc; --visited-color: #8b6fcb; --blockquote-color: #222; color-scheme: light; }
  :root[data-theme="dark"] { --background-color: #01242e; --heading-color: #eee; --text-color: #ddd; --link-color: #8cc2dd; --visited-color: #8b6fcb; --blockquote-color: #ccc; color-scheme: dark; }
  #theme-toggle { border: 0; padding: 0; font: inherit; background: transparent; color: var(--link-color); }
  #theme-toggle:hover { text-decoration: underline; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--link-color); outline-offset: 4px; }
  @media (max-width: 500px) { ul.blog-posts li { gap: 8px; } ul.blog-posts li span { flex-basis: 100px; } }
</style>
{{ if .IsHome }}
<style>
  html {
    min-height: 100%;
    background: #6494be url('{{ "theme/blue-texture.png" | relURL }}') center / cover fixed;
    isolation: isolate;
  }
  html::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url('{{ "theme/cat-stickers.png" | relURL }}') center / contain no-repeat;
    opacity: .48;
    pointer-events: none;
    z-index: -1;
  }
  body {
    box-sizing: border-box;
    width: calc(100% - 48px);
    max-width: 784px;
    margin: 48px auto;
    padding: 32px;
    border-radius: 12px;
    background: rgba(241, 247, 253, .86);
  }
  :root[data-theme="dark"] body { background: rgba(1, 36, 46, .91); }
  @media (max-width: 600px) {
    body { width: calc(100% - 24px); margin: 20px auto; padding: 24px 20px; }
    html { background-attachment: scroll; }
  }
</style>
{{ end }}
<script>
  (() => {
    let stored;
    try { stored = localStorage.getItem('bear-theme'); } catch {}
    const preferred = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = stored === 'dark' || stored === 'light' ? stored : preferred;
    addEventListener('DOMContentLoaded', () => {
      const button = document.getElementById('theme-toggle');
      const update = () => { button.textContent = document.documentElement.dataset.theme === 'dark' ? '浅色' : '暗色'; };
      button.addEventListener('click', () => {
        const mode = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = mode;
        try { localStorage.setItem('bear-theme', mode); } catch {}
        update();
      });
      update();
    });
  })();
</script>
